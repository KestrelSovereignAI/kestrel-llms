name: LLM Provider Packages

on:
  pull_request:
    paths:
      - "providers/**"
      - "tests/unit/providers/**"
      - "scripts/llm_provider_packages.sh"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/llm-provider-packages.yml"
  push:
    branches: [main]
    paths:
      - "providers/**"
      - "tests/unit/providers/**"
      - "scripts/llm_provider_packages.sh"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/llm-provider-packages.yml"
  workflow_dispatch:
    inputs:
      package:
        description: "Optional package to publish after verification"
        required: false
        type: choice
        options:
          - ""
          - kestrel-llm-openai-compat
          - kestrel-llm-deepseek
          - kestrel-llm-xai
          - kestrel-llm-kimi
          - kestrel-llm-vertex
          - kestrel-llm-bedrock
          - kestrel-llms

permissions:
  contents: read

jobs:
  provider-packages:
    name: Providers (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      - name: Install Kestrel test environment
        run: uv sync --locked --python ${{ matrix.python }} --group test

      - name: Verify provider packages
        shell: bash
        run: scripts/llm_provider_packages.sh verify

      - name: Install the optional aiohttp transport alongside HTTPX
        run: uv pip install "aiohttp>=3.14,<4"

      - name: Verify native clients with aiohttp present
        run: uv run --locked --no-sync --group test pytest tests/unit/providers/test_backend_completion_streams.py tests/unit/providers/test_native_stream_ownership.py tests/unit/providers/test_llm_provider_plugins.py

  build:
    name: Build selected package
    needs: provider-packages
    if: github.event_name == 'workflow_dispatch' && inputs.package != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Build selected package
        run: |
          rm -rf dist
          uv build --package "${{ inputs.package }}" --out-dir dist

      - name: Show artifacts
        run: ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ inputs.package }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish selected package
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.package != ''
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ inputs.package }}
          path: dist/

      - name: Publish via PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
