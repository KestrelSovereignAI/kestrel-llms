[project]
name = "kestrel-llm-kimi"
version = "0.2.0"
description = "Moonshot Kimi LLM provider plugin for Kestrel Sovereign."
requires-python = ">=3.11"
dependencies = [
    "kestrel-llm-openai-compat>=0.2.0,<1",
    "kestrel-sovereign-sdk>=0.49.0,<1",
    "openai>=3.46.0,<4",
    "pydantic>=2",
]

[project.entry-points."kestrel_sovereign.llm_providers"]
kimi = "kestrel_llm_kimi:KimiAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
