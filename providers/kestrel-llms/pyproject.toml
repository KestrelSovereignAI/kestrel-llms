[project]
name = "kestrel-llms"
version = "0.2.0"
description = "Convenience extras for Kestrel Sovereign LLM provider plugins."
requires-python = ">=3.11"
dependencies = [
    "kestrel-sovereign-sdk>=0.49.0,<1",
]

[project.optional-dependencies]
deepseek = ["kestrel-llm-deepseek>=0.2.0,<0.3"]
xai = ["kestrel-llm-xai>=0.2.0,<0.3"]
kimi = ["kestrel-llm-kimi>=0.2.0,<0.3"]
vertex = ["kestrel-llm-vertex>=0.2.0,<0.3"]
bedrock = ["kestrel-llm-bedrock>=0.2.0,<0.3"]
cloud = [
    "kestrel-llm-bedrock>=0.2.0,<0.3",
    "kestrel-llm-deepseek>=0.2.0,<0.3",
    "kestrel-llm-xai>=0.2.0,<0.3",
    "kestrel-llm-kimi>=0.2.0,<0.3",
    "kestrel-llm-vertex>=0.2.0,<0.3",
]
all = [
    "kestrel-llm-bedrock>=0.2.0,<0.3",
    "kestrel-llm-deepseek>=0.2.0,<0.3",
    "kestrel-llm-xai>=0.2.0,<0.3",
    "kestrel-llm-kimi>=0.2.0,<0.3",
    "kestrel-llm-vertex>=0.2.0,<0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
