[project]
name = "kestrel-llm-bedrock"
version = "0.2.0"
description = "AWS Bedrock LLM provider plugin for Kestrel Sovereign."
requires-python = ">=3.11"
dependencies = [
    "urllib3>=2.8.0,<3",
    "botocore>=1.43.124,<2",
    "boto3>=1.43.124,<2",
    "kestrel-sovereign-sdk>=0.49.0,<1",
    "pydantic>=2",
]

[project.entry-points."kestrel_sovereign.llm_providers"]
bedrock = "kestrel_llm_bedrock:BedrockAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
