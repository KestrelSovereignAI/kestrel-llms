[project]
name = "kestrel-llm-vertex"
version = "0.2.0"
description = "Google Vertex AI LLM provider plugin for Kestrel Sovereign."
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.16.0,<3",
    "google-auth>=2.62.1,<3",
    "google-genai>=2.34.0,<3",
    "kestrel-sovereign-sdk>=0.49.0,<1",
    "pydantic>=2",
]

[project.entry-points."kestrel_sovereign.llm_providers"]
vertex_ai = "kestrel_llm_vertex:VertexAIAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
