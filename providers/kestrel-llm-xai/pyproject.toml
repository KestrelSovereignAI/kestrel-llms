[project]
name = "kestrel-llm-xai"
version = "0.2.0"
description = "xAI Grok LLM provider plugin for Kestrel Sovereign."
requires-python = ">=3.11"
dependencies = [
    "kestrel-llm-openai-compat>=0.2.0,<1",
    "kestrel-sovereign-sdk>=0.49.0,<1",
    "openai>=3.46.0,<4",
    "pydantic>=2",
]

[project.entry-points."kestrel_sovereign.llm_providers"]
xai = "kestrel_llm_xai:XAIAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
